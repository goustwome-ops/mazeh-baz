<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مزه باز</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;color:#fff;font-family:Tahoma,system-ui,sans-serif}
body{background:linear-gradient(160deg,#2346a8 0%,#4a7df0 52%,#f0506a 100%) fixed;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(78px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
header{font-size:21px;font-weight:800;padding:6px 0;display:flex;justify-content:space-between;align-items:center}header small{font-size:11px;opacity:.85;font-weight:400;text-align:left}
.g,.card{background:linear-gradient(135deg,#ffffff38,#ffffff12);border:1px solid #ffffff40;border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 6px 18px #0b1f6a33}
#pg{animation:in .25s ease}#pg.sl{animation:sl .28s ease}#pg.sr{animation:sr .28s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}@keyframes sl{from{opacity:0;transform:translateX(-46px)}}@keyframes sr{from{opacity:0;transform:translateX(46px)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips b{white-space:nowrap;padding:7px 13px;border-radius:20px;background:#ffffff26;border:1px solid #ffffff33;font-size:13px}.chips b.on{background:linear-gradient(135deg,#ff5d7a,#d62839);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}.card{position:relative;padding:4px;text-align:center;transition:transform .15s}.card:active,button:active{transform:scale(.93)}.card.on{outline:2px solid #fff}.card.busy{background:linear-gradient(135deg,#ff5d7a77,#d6283933)}
.card img,.ph{width:100%;height:44px;object-fit:cover;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#ffffff26}.card p{margin:3px 0 0;font-weight:700;font-size:10.5px;line-height:1.3}.card small{font-size:9.5px;opacity:.85}
.q{position:absolute;top:2px;left:2px;background:linear-gradient(135deg,#ff5d7a,#d62839);border-radius:10px;padding:0 6px;font-size:11px;font-weight:700}
.box{padding:12px;margin:10px 0;line-height:1.9}.r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}.m{opacity:.8}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
input,select,button{font:inherit;padding:10px;border-radius:12px;border:1px solid #ffffff44;background:#ffffff26;color:#fff;max-width:100%;transition:transform .15s}input{width:100%;margin:4px 0}input::placeholder{color:#ffffffaa}option{color:#000}.pr{width:100px}
.go{background:linear-gradient(135deg,#ff5d7a,#d62839);border:0;font-weight:700;padding:12px;width:100%;margin-top:6px}
.ad{position:relative;display:flex;gap:10px;padding:10px 28px 10px 10px;margin-bottom:8px;font-size:13px}.ad p{margin:2px 0}.ad img{width:48px;height:48px;border-radius:10px;object-fit:cover}.ad a{color:#fff;font-weight:700}.x{position:absolute;top:4px;right:8px;opacity:.8}.bs{background:linear-gradient(135deg,#ffcf5a55,#ff5d7a44)}
.last{margin-top:12px}.last h4{margin:6px 0}.o{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;padding:7px 8px;margin:5px 0;border-radius:12px;background:#ffffff1f}.o b{font-weight:400;padding:5px 7px;border-radius:10px;border:1px solid #fff6;margin-right:3px;white-space:nowrap;display:inline-block}.o b.ok{background:#1db954bb;border-color:transparent}.o i{font-size:9px;opacity:.9}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1b2f7af0;border-top:1px solid #ffffff33;padding-bottom:env(safe-area-inset-bottom,0px)}nav a{flex:1;text-align:center;padding:8px 0;font-size:10.5px;opacity:.7}nav a.on{opacity:1;color:#ffc2cd;font-weight:700}
.cart{position:fixed;left:8px;right:8px;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:10px;background:#1f3a94f5;border:1px solid #fff4;border-radius:18px;max-height:44vh;overflow:auto;box-shadow:0 -6px 24px #0007;z-index:5}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.kpi div{padding:10px;border-radius:14px;background:#ffffff22}.kpi b{display:block;font-size:17px;color:#fff}
.center{text-align:center;padding-top:6vh}.center h1{font-size:27px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#fff;color:#23439f;padding:10px 18px;border-radius:20px;z-index:200;display:none;font-weight:700;text-align:center}
.p{position:fixed;font-size:24px;animation:b 1.7s ease-out forwards;z-index:150;pointer-events:none}@keyframes b{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.ovl{position:fixed;inset:0;background:#0a1a5acc;z-index:100;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 10px 20px;backdrop-filter:blur(6px)}
.lux{max-width:420px;margin:10vh auto 0;padding:20px;text-align:center;border-radius:24px;background:linear-gradient(135deg,#ffffff50,#ffffff18);border:1px solid #fff7;box-shadow:0 20px 60px #0008;position:relative}.lux img{max-width:60%;border-radius:14px}.lux a{display:inline-flex;align-items:center;gap:6px;margin:6px;padding:10px 16px;border-radius:14px;background:#fff;color:#23439f;font-weight:700;text-decoration:none}
.sheet{max-width:560px;margin:0 auto;background:linear-gradient(180deg,#fffdf5,#f7efe0);color:#222;border-radius:14px;padding:18px;border:3px double #b8892b;position:relative;font-size:13px}.sheet h2,.sheet h3{margin:2px 0;color:#1f3a94}.sheet h4{margin:14px 0 4px;color:#b3243a;border-bottom:1px solid #b8892b55}.sheet .kpi div{background:#1f3a9412}.sheet .kpi b{color:#b3243a}
.sheet table{width:100%;border-collapse:collapse}.sheet td,.sheet th{padding:5px;border-bottom:1px solid #00000015;text-align:right}.sheet th{background:#1f3a9418}.sheet button{color:#fff;background:#1f3a94;border:0}
.seal{position:absolute;top:10px;left:10px;width:66px;height:66px;border:3px double #b3243a;border-radius:50%;color:#b3243a;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-14deg);line-height:1.2;opacity:.85}
</style></head><body><div id="app"></div><div id="toast"></div><script src="config.js"></script><script src="app.js"></script></body></html>
