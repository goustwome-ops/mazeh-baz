name: Unzip
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          for f in *.zip; do unzip -o "$f" -x ".github/*"; done
          rm -f *.zip
          git config user.name bot
          git config user.email bot@example.com
          git add -A
          git commit -m "unzip" || echo "nothing"
          git push
