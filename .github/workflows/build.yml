name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.VIBRATE" /></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KS_PASS }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android && chmod +x gradlew
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.jks" -Pandroid.injected.signing.store.password="$KP" -Pandroid.injected.signing.key.alias="$KA" -Pandroid.injected.signing.key.password="$KP"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with: { name: mazeh-baz-apk, path: "android/app/build/outputs/apk/**/*.apk" }
