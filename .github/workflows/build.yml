name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(ls -t mazeh-baz-project*.zip | head -1)
          echo "Using $Z"
          mkdir app && unzip -q "$Z" -d app
          if [ -f config.js ]; then cp config.js app/www/config.js; fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install and add Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.VIBRATE" /></manifest>#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build
        working-directory: app/android
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KS_PASS }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.jks" -Pandroid.injected.signing.store.password="$KP" -Pandroid.injected.signing.key.alias="$KA" -Pandroid.injected.signing.key.password="$KP"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with: { name: mazeh-baz-apk, path: "app/android/app/build/outputs/apk/**/*.apk" }
